name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build & Run Tests
        run: cargo test --all-targets --verbose

  quality:
    name: Code Quality & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Embedded JavaScript Syntax
        run: |
          node --check crates/grio/src/assets/js/core.js \
            crates/grio/src/assets/js/forms.js \
            crates/grio/src/assets/js/data.js \
            crates/grio/src/assets/js/media.js \
            crates/grio/src/assets/js/canvas_editor.js \
            crates/grio/src/assets/js/special.js \
            crates/grio/src/assets/js/router.js \
            crates/grio/src/assets/js/i18n.js
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build Documentation
        run: cargo doc -p grio --no-deps --all-features
